<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found - Web Proxy Auto-Discovery</title>
<style>
html, body {
	margin: 0;
}
html, body, div, h2 {
	font-weight: normal;
	font-style: normal;
	font-size: 1em;
	background: transparent;
}
body {
	/* Centre content, but let it grow and scroll when taller than the window */
	display: flex;
	align-items: center;
	justify-content: center;
	min-height: 100vh;
}
.content {
	box-sizing: border-box;
	max-width: 60em;
	padding: 4em;
}
.content h2 {
	font-size: 2em;
	text-shadow: 0 3px 3px #999;
}
@media (max-width: 40em) {
	.content { padding: 1em; }
}
</style>
</head>
<body>
<div class="content">
<h2>404</h2>
<h3>Page not found</h3>
<p>Please check the URL in the address bar and try again.</p>
<p><a href="/">Go to the home page</a></p>
</div>
</body>
</html>
