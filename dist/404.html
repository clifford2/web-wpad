<!DOCTYPE html>
<html lang="en" xml:lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Web Proxy Auto-Discovery</title>
<link rel="stylesheet" href="highlight.min.css">
<style media="screen" type="text/css">
body, html {
	height: 100%;
	margin: 0;
}
html, body, div, object, h2
{
	font-weight: normal;
	font-style: normal;
	font-size: 1em;
	background: transparent;
}
/*
a:link, a:visited, a:hover, a:active { text-decoration: none; }
a:hover { text-decoration: underline; }
*/
.content h2 {
	font-size: 2em;
	text-shadow: 0 3px 3px #999;
}
.content {
	font-size: 1em;
	margin: 0;
	padding: 4em;
	position: absolute;
	top: 50%;
	left: 50%;
	margin-right: -50%;
	transform: translate(-50%, -50%)
}
</style>
</head>
<body>
<div class="wrapper2">
<div class="content">
<h2>404</h2>
<h3>Page not found</h2>
<p>Please check the URL in the address bar and try again.</p>
<p><a href="/">Go back</a></p>
</div>
</div>
</body>
</html>
