// /etc/kea/kea-dhcp4.conf
// Search for "wpad-url" to find relevant configuration options

{
"Dhcp4": {
    "interfaces-config": {
        "interfaces": [ "enp7s0" ]
    },
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "kea4-ctrl-socket"
    },
    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "/var/lib/kea/kea-leases4.csv",
        "lfc-interval": 3600
    },
    "expired-leases-processing": {
        "reclaim-timer-wait-time": 10,
        "flush-reclaimed-timer-wait-time": 25,
        "hold-reclaimed-time": 3600,
        "max-reclaim-leases": 100,
        "max-reclaim-time": 250,
        "unwarned-reclaim-cycles": 5
    },
    "renew-timer": 900,
    "rebind-timer": 1800,
    "valid-lifetime": 3600,
    // ---- Define WPAD option 255 ---- //
    "option-def": [
      {
        "name": "wpad-url",
        "code": 252,
        "type": "string",
        "space": "dhcp4"
      }
    ],
    "option-data": [
        {
            "name": "domain-name-servers",
            "data": "192.168.42.1"
        },
        {
            "name": "domain-name",
            "data": "example.com"
        },
        {
            "name": "domain-search",
            "data": "example.com"
        },
        {
            "name": "default-ip-ttl",
            "data": "0xf0"
        }
    ],
    "subnet4": [
        {
            "id": 1,
            "subnet": "192.168.42.0/24",
            "pools": [ { "pool": "192.168.42.200 - 192.168.42.254" } ],
            "option-data": [
                {
                    "name": "routers",
                    "data": "192.168.42.1"
                },
                // ---- Set WPAD option value ---- //
                {
                    "name": "wpad-url",
                    "data": "http://wpad.home.weinmann.africa/wpad.dat"
                }
            ],
        }
    ],
}
}
